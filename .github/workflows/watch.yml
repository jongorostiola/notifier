name: watch

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 Madrid (CEST); 06:00 in winter
  workflow_dispatch:      # keep — this is how you test

permissions:
  contents: write         # required to commit state/

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}   # repo variable; unset = code default
        run: python watcher.py

      - name: Commit state
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add state/
          git diff --cached --quiet || git commit -m 'chore: update watcher state'
          git push