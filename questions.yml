    MY ZONE - the Abando and Abandoibarra districts on the left bank of the ria, roughly a
    10-minute walk from Paseo de Uribitarte:
      - Puente de La Salve (Puente de los Principes de Espana) and its access ramps
      - Paseo de Uribitarte and Muelle de Uribitarte
      - Alameda de Mazarredo
      - Abandoibarra: Avenida Abandoibarra, Plaza Euskadi, the Guggenheim surroundings,
