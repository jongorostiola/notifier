        Calle Rodriguez Arias, Jardines de Albia, Estacion de Abando
      - Puente de Deusto, Zubizuri, Puente del Ayuntamiento
    Somewhere clearly outside it - Casco Viejo, Indautxu, San Mames, Zorrotzaurre, Basurto,
